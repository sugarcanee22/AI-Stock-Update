name: Portfolio Watch

on:
  schedule:
    # 7:00 AM Singapore time (SGT = UTC+8) -> 23:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # allows manual runs from the Actions tab

jobs:
  run-portfolio-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Portfolio Watch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TICKERS: "D05:DBS Group Holdings,S58:SATS Ltd,C09:City Developments Limited (CDL),G13:Genting Singapore,AWX:AEM Holdings"
        run: python portfolio_watch.py
